[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frivault"
version = "0.1.0"
description = "Offline-first local encrypted file vault for Windows"
readme = "README.md"
requires-python = ">=3.11,<3.16"
license = { text = "Proprietary" }
dependencies = [
    "pywebview==6.2.1",
    "cryptography==50.0.1",
    "PyNaCl==1.6.2",
    "argon2-cffi==25.1.0",
    "platformdirs==4.11.10",
]

[project.optional-dependencies]
dev = ["ruff==0.16.8"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[project.scripts]
frivault = "frivault.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
frivault = [
    "resources/ui/index.html",
    "resources/ui/css/*.css",
    "resources/ui/js/*.js",
    "resources/ui/assets/*.ico",
    "resources/ui/assets/*.svg",
]
